[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rca-investigator"
version = "0.0.1"
description = "An evidence-first AI investigator for root cause analysis"
readme = "README.md"
license = "MIT"
authors = [{ name = "Deeksha" }]
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
rca = "rca_investigator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
