[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rca-investigator"
version = "1.0.0"
description = "An evidence-first AI investigator for root cause analysis"
readme = "README.md"
license = "MIT"
authors = [{ name = "Deeksha" }]
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7", "numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "pypdf>=4", "openpyxl>=3.1", "python-docx>=1.1"]
dev = ["pytest>=8", "ruff>=0.5", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27",
       "pypdf>=4", "openpyxl>=3.1", "python-docx>=1.1"]

[project.scripts]
rca = "rca_investigator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rca_investigator = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
