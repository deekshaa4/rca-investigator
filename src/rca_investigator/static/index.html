<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCA Investigator</title>
<style>
:root {
  --bg: #f4f5fb; --panel: #ffffff; --ink: #1f2430; --muted: #5d6475; --line: #e2e5ee;
  --accent: #4f6bed; --accent-soft: #e8ecfd;
  --bot-body: #fffdfa; --bot-line: #f1d2cb; --bot-red: #f2545b; --bot-face: #ffeee8;
  --user: #4f6bed; --user-ink: #ffffff;
  --ok: #1f8a5b; --ok-soft: #e3f5ec; --warn: #a76a00; --warn-soft: #fff3da;
  --bad: #b3383d; --bad-soft: #fbe6e7; --shadow: 0 2px 10px rgba(30, 40, 80, .08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161d; --panel: #1d2029; --ink: #e8eaf1; --muted: #a2a8b8; --line: #2e3240;
    --accent: #8ea0ff; --accent-soft: #262c48;
    --bot-body: #fffaf6; --bot-line: #e7b9b0; --bot-red: #ff6b70; --bot-face: #ffe9e2;
    --user: #3d4fb8; --user-ink: #ffffff;
    --ok: #5fd39c; --ok-soft: #1b3329; --warn: #f0b955; --warn-soft: #3a2f17;
    --bad: #f08a8e; --bad-soft: #3d1f22; --shadow: 0 2px 10px rgba(0, 0, 0, .35);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
button { font: inherit; cursor: pointer; }

header { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
  border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 1.05rem; margin: 0; flex: 1; }
header h1 span { color: var(--muted); font-weight: 400; }
.toggle { display: flex; gap: 6px; align-items: center; font-size: .85rem; color: var(--muted); }
.ghost { background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 8px;
  padding: 4px 10px; font-size: .85rem; }

#messages { flex: 1; overflow-y: auto; padding: 20px 16px 40px; }
.msg { max-width: 760px; margin: 0 auto 14px; display: flex; gap: 10px; }
.msg.user { justify-content: flex-end; }
.msg .avatar { width: 32px; height: 32px; flex: none; border-radius: 50%; background: var(--accent-soft);
  display: grid; place-items: center; font-size: 1.1rem; }
.bubble { padding: 10px 14px; border-radius: 16px; max-width: 100%; overflow-wrap: anywhere; }
.bot .bubble { background: var(--panel); box-shadow: var(--shadow); border-top-left-radius: 4px; }
.user .bubble { background: var(--user); color: var(--user-ink); border-top-right-radius: 4px;
  max-width: 80%; white-space: pre-wrap; }
.bubble p { margin: 0 0 6px; } .bubble p:last-child { margin: 0; }
.actions-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.actions-row button, .actions-row a { background: var(--accent-soft); color: var(--accent); border: none;
  border-radius: 999px; padding: 5px 12px; font-size: .85rem; font-weight: 600; text-decoration: none; }
.file-note { font-size: .9rem; }
.error-text { color: var(--bad); }

/* Live stage tracker while CuteBot works */
.stages { list-style: none; padding: 0; margin: 4px 0 6px; font-size: .9rem; }
.stages li { padding: 3px 0; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.stages li.now { color: var(--ink); font-weight: 600; }
.stages li.now .dot { animation: pulse 1s infinite; }
.stages li.done { color: var(--ok); }
.stages .dot { width: 22px; text-align: center; }
.detail { font-size: .82rem; color: var(--muted); min-height: 1.2em; }
@keyframes pulse { 50% { transform: scale(1.3); } }

/* Report cards */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin-top: 4px; }
.card { background: var(--bg); border-radius: 12px; padding: 12px 14px; opacity: 0;
  transform: translateY(10px); animation: rise .45s forwards; }
.card.wide { grid-column: 1 / -1; }
.card h3 { font-size: .9rem; margin: 0 0 6px; }
.card ul { margin: 4px 0; padding-left: 18px; font-size: .9rem; }
.card p { font-size: .9rem; }
@keyframes rise { to { opacity: 1; transform: none; } }
.verdict { font-size: 1.2rem; font-weight: 700; text-transform: capitalize; }
.v-sufficient { background: var(--ok-soft); } .v-sufficient .verdict { color: var(--ok); }
.v-partial { background: var(--warn-soft); } .v-partial .verdict { color: var(--warn); }
.v-insufficient { background: var(--bad-soft); } .v-insufficient .verdict { color: var(--bad); }
.reasons { list-style: none; padding: 0 !important; }
.factor + .factor { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; }
.meta { font-size: .78rem; color: var(--muted); }
.bar { height: 6px; background: var(--line); border-radius: 3px; margin: 4px 0; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.chip { display: inline-block; font-size: .72rem; font-weight: 600; padding: 0 7px; margin: 0 3px 3px 0;
  border-radius: 999px; background: var(--accent-soft); color: var(--accent); cursor: help; }
details summary { cursor: pointer; font-size: .9rem; font-weight: 600; }

/* Explanation styles, chart, printing */
.style-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
.style-btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px;
  padding: 3px 10px; font-size: .8rem; }
.style-btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.chart { margin: 0 0 10px; background: var(--bg); border-radius: 12px; padding: 10px 12px 4px; }
.chart figcaption { font-size: .85rem; margin-bottom: 4px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .axis { font-size: 10px; fill: var(--muted); }
.chart .marker { cursor: help; }
details.more { margin-top: 8px; }
.report { width: 100%; }
@media print {
  html, body { height: auto; }
  body { display: block; background: #fff; }
  #messages { overflow: visible; }
  body * { visibility: hidden; }
  .print-me, .print-me * { visibility: visible; }
  .print-me { box-shadow: none !important; }
  .print-me .style-row, .print-me .actions-row { display: none; }
  #cutebot, header, .composer-wrap { display: none; }
  .card { opacity: 1 !important; transform: none !important; animation: none !important; }
}

/* Composer */
.composer-wrap { padding: 10px 16px 16px; background: linear-gradient(transparent, var(--bg) 30%); }
.composer { max-width: 760px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 6px;
  box-shadow: var(--shadow); }
.composer.drag { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.round { width: 38px; height: 38px; flex: none; border-radius: 50%; border: none; font-size: 1.3rem;
  display: grid; place-items: center; }
#plus { background: var(--accent-soft); color: var(--accent); }
#send { background: var(--accent); color: #fff; font-size: 1.1rem; }
#send:disabled { opacity: .4; cursor: default; }
textarea { flex: 1; border: none; resize: none; background: transparent; color: var(--ink);
  font: inherit; padding: 8px 4px; max-height: 180px; outline: none; min-width: 0; }
.hint { max-width: 760px; margin: 6px auto 0; font-size: .75rem; color: var(--muted); text-align: center; }

/* CuteBot, free to roam the page */
#cutebot { position: fixed; left: 0; top: 0; width: 72px; z-index: 50; cursor: pointer;
  transition: transform 1.1s cubic-bezier(.45, 0, .3, 1.25); will-change: transform; }
#cutebot.busy { pointer-events: none; }
#cutebot svg { width: 72px; height: 83px; display: block; animation: bob 1.6s ease-in-out infinite; }
#cutebot.busy svg { animation: waddle .32s ease-in-out infinite; }
#cutebot.happy svg { animation: hop .5s ease-in-out 3; }
#cutebot.wave .arm-r { animation: wave .3s ease-in-out 4; transform-origin: 70px 58px; }
#cutebot.busy .arm-l, #cutebot.busy .arm-r { animation: flap .32s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
@keyframes flap { 50% { transform: rotate(18deg); } }
@keyframes bob { 50% { transform: translateY(-4px); } }
@keyframes waddle { 0%, 100% { transform: rotate(-7deg) translateY(0); } 50% { transform: rotate(7deg) translateY(-6px); } }
@keyframes hop { 50% { transform: translateY(-20px) scale(1.05); } }
@keyframes wave { 0%, 100% { transform: rotate(-25deg); } 50% { transform: rotate(-70deg); } }
.eye { animation: blink 4s infinite; transform-origin: center; transform-box: fill-box; }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
#prop { position: absolute; right: -14px; top: 30px; font-size: 1.4rem;
  animation: float 1.2s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-5px) rotate(8deg); } }
#say { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); margin-bottom: 6px;
  width: max-content; max-width: 230px; background: var(--ink); color: var(--panel); font-size: .78rem;
  line-height: 1.35; padding: 6px 10px; border-radius: 10px; opacity: 0; transition: opacity .25s;
  pointer-events: none; text-align: center; white-space: pre-line; }
#say.show { opacity: 1; }
#say::after { content: ""; position: absolute; top: 100%; left: var(--tail, 50%); margin-left: -6px;
  border: 6px solid transparent; border-top-color: var(--ink); }
.sparkle { position: fixed; z-index: 49; pointer-events: none; font-size: .9rem;
  animation: sparkle 1.2s forwards; }
@keyframes sparkle { to { opacity: 0; transform: translateY(-16px) scale(.4); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .card { opacity: 1; transform: none; }
}
@media (max-width: 560px) {
  #cutebot, #cutebot svg { width: 56px; } #cutebot svg { height: 65px; }
  header h1 span { display: none; }
}
</style>
</head>
<body>
<header>
  <h1>RCA Investigator <span>· find what changed, why, and whether the evidence is enough</span></h1>
  <label class="toggle" title="Keep short case notes on this computer so I can recognise similar problems and learn from your corrections. Nothing leaves this computer."><input type="checkbox" id="remember"> 🧠 Remember</label>
  <button class="ghost" id="forget" hidden title="Delete all case notes">Forget</button>
  <label class="toggle"><input type="checkbox" id="use-llm" checked> AI model</label>
  <button class="ghost" id="new-chat">New chat</button>
</header>

<div id="messages" aria-live="polite"></div>

<div class="composer-wrap">
  <form class="composer" id="composer">
    <button type="button" class="round" id="plus" title="Upload files: CSV, Excel, PDF, Word, JSON, text or logs" aria-label="Upload files">+</button>
    <input type="file" id="files" multiple hidden>
    <textarea id="input" rows="1" placeholder="Ask CuteBot or paste data..." aria-label="Message"></textarea>
    <button type="submit" class="round" id="send" aria-label="Send">➤</button>
  </form>
  <p class="hint">Your files stay on this computer. Drag any file here or use ➕ (CSV, Excel, PDF, Word, text). Enter sends, Shift+Enter adds a line.</p>
</div>

<div id="cutebot" title="CuteBot">
  <div id="say"></div>
  <span id="prop"></span>
  <svg viewBox="0 0 90 104" aria-hidden="true">
    <path d="M45 16 C45 10 45 8 45 6" stroke="var(--bot-red)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M45 7 c-2-3.5-7-2.5-6.5 1.2 c.4 2.6 4 4.6 6.5 6.4 c2.5-1.8 6.1-3.8 6.5-6.4 c.5-3.7-4.5-4.7-6.5-1.2z" fill="var(--bot-red)"/>
    <ellipse cx="16" cy="40" rx="6" ry="7" fill="var(--bot-red)"/>
    <ellipse cx="74" cy="40" rx="6" ry="7" fill="var(--bot-red)"/>
    <ellipse class="arm-l" cx="15" cy="66" rx="7" ry="11" fill="var(--bot-body)" stroke="var(--bot-line)" stroke-width="2" transform="rotate(25 15 66)"/>
    <ellipse class="arm-r" cx="75" cy="66" rx="7" ry="11" fill="var(--bot-body)" stroke="var(--bot-line)" stroke-width="2" transform="rotate(-25 75 66)"/>
    <ellipse cx="31" cy="95" rx="10" ry="6" fill="var(--bot-red)"/>
    <ellipse cx="59" cy="95" rx="10" ry="6" fill="var(--bot-red)"/>
    <ellipse cx="45" cy="56" rx="31" ry="38" fill="var(--bot-body)" stroke="var(--bot-line)" stroke-width="2"/>
    <ellipse cx="45" cy="42" rx="20" ry="16" fill="var(--bot-face)"/>
    <ellipse class="eye" cx="37" cy="41" rx="3.6" ry="4.6" fill="#2b2230"/>
    <ellipse class="eye" cx="53" cy="41" rx="3.6" ry="4.6" fill="#2b2230"/>
    <circle cx="38.4" cy="39.4" r="1.3" fill="#fff"/><circle cx="54.4" cy="39.4" r="1.3" fill="#fff"/>
    <ellipse cx="30" cy="48" rx="3.6" ry="2.2" fill="#ff8a9b" opacity=".75"/>
    <ellipse cx="60" cy="48" rx="3.6" ry="2.2" fill="#ff8a9b" opacity=".75"/>
    <path d="M41 49 q4 3.5 8 0" stroke="#2b2230" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <circle cx="45" cy="73" r="9" fill="var(--bot-red)"/>
    <circle cx="43.5" cy="71.5" r="4" fill="none" stroke="#fff" stroke-width="2"/>
    <path d="M46.5 74.5 l3.5 3.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
  </svg>
</div>

<script>
const $ = (s) => document.querySelector(s);
const STAGES = [
  ["collect", "🧺", "Collecting the evidence"],
  ["polish", "✨", "Polishing the evidence"],
  ["think", "🧠", "Understanding the root cause"],
  ["weigh", "⚖️", "Weighing it up"],
  ["back", "🎁", "Coming back with the answer"],
];
const IDLE_LINES = ["Hmm, let me look closer...", "Sniff sniff 🔍", "Ooh, a clue!", "Hold on, nearly there...",
  "Checking under this graph...", "Connecting the dots...", "Tiny detective at work 🕵️"];
const TAP_LINES = ["Hi there! 👋", "That tickles!", "Ready when you are!", "Share some data with me ✨"];
const AVATAR = `<svg viewBox="14 14 62 58" width="26" height="26" aria-hidden="true">
  <ellipse cx="16" cy="40" rx="6" ry="7" fill="var(--bot-red)"/><ellipse cx="74" cy="40" rx="6" ry="7" fill="var(--bot-red)"/>
  <ellipse cx="45" cy="50" rx="29" ry="28" fill="var(--bot-body)" stroke="var(--bot-line)" stroke-width="2"/>
  <ellipse cx="45" cy="44" rx="19" ry="15" fill="var(--bot-face)"/>
  <ellipse cx="37" cy="43" rx="3.6" ry="4.6" fill="#2b2230"/><ellipse cx="53" cy="43" rx="3.6" ry="4.6" fill="#2b2230"/>
  <ellipse cx="30" cy="50" rx="3.6" ry="2.2" fill="#ff8a9b" opacity=".75"/><ellipse cx="60" cy="50" rx="3.6" ry="2.2" fill="#ff8a9b" opacity=".75"/>
  <path d="M41 51 q4 3.5 8 0" stroke="#2b2230" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>`;
let sessionId = newSessionId();
let busy = false;

function newSessionId() {
  const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
  return id.replace(/[^A-Za-z0-9-]/g, "").slice(0, 64);
}
function esc(t) { const d = document.createElement("div"); d.textContent = t ?? ""; return d.innerHTML; }
function richText(t) {
  return esc(t).split("\n").map((line) => `<p>${line
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>")}</p>`).join("");
}

/* ---------- chat ---------- */
function addMessage(who, html) {
  const row = document.createElement("div");
  row.className = `msg ${who}`;
  row.innerHTML = who === "bot" ? `<div class="avatar">${AVATAR}</div><div class="bubble">${html}</div>`
                                : `<div class="bubble">${html}</div>`;
  const box = $("#messages");
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
  return row.querySelector(".bubble");
}

let connected = null;
function welcome() {
  if (connected) {
    const c = addMessage("bot", richText(`Hi! I'm **CuteBot**, your root cause detective. 🕵️\n${connected}\n` +
      "Just ask me what happened, e.g. *Why did the error rate go up on 26 March?* I'll find the right tables and the right time myself. " +
      "You can still upload or paste extra files with ➕."));
    return c;
  }
  const b = addMessage("bot", richText(
    "Hi! I'm **CuteBot**, your root cause detective. 🕵️\n" +
    "Click ➕ to share **anything about the problem**: an incident write-up, emails or notes (PDF, Word, text), " +
    "a **table of numbers** (CSV or Excel), or logs and change records. Or just paste the text here.\n" +
    "Then ask me what went wrong, e.g. *What caused the checkout outage?* I'll read every part and show you the proof."));
  b.insertAdjacentHTML("beforeend", `<div class="actions-row">
    <button type="button" data-act="sample">Try a sample</button>
    <a href="/api/sample-file/metrics.csv">Example table (CSV)</a>
    <a href="/api/sample-file/records.csv">Example records (CSV)</a></div>`);
  b.querySelector('[data-act="sample"]').addEventListener("click", trySample);
}

async function trySample() {
  if (busy) return;
  try {
    const r = await post("/api/sample", { session: sessionId });
    addMessage("bot", richText(`${r.summary}\nTry asking: *${r.question}*`));
    input.value = r.question;
    autosize();
    input.focus();
    hop("Ooh, a new case! 📦");
  } catch (err) {
    addMessage("bot", `<p class="error-text">${esc(err.message)}</p>`);
  }
}

async function post(url, body) {
  const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const detail = Array.isArray(data.detail) ? "That couldn't be read." : data.detail;
    throw new Error(detail || `Request failed (${res.status})`);
  }
  return data;
}

function toBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(",")[1] || "");
    reader.onerror = () => reject(new Error("The file couldn't be read."));
    reader.readAsDataURL(file);
  });
}

async function uploadFiles(fileList) {
  if (busy) return;
  for (const file of [...fileList]) {
    addMessage("user", `📎 ${esc(file.name)}`);
    if (file.size > 20e6) { addMessage("bot", `<p class="error-text">${esc(file.name)} is too big (over 20 MB).</p>`); continue; }
    roam("collect", `Reading ${file.name}`);
    try {
      const r = await post("/api/upload", { session: sessionId, name: file.name, data_base64: await toBase64(file) });
      const reply = r.message || `Got **${file.name}**. ${r.summary}`;
      addMessage("bot", `<div class="file-note">${richText(reply)}</div>`);
      home("Yum, data! 😋");
    } catch (err) {
      addMessage("bot", `<p class="error-text">${esc(file.name)}: ${esc(err.message)}</p>`);
      home("Oops, I couldn't read that one.");
    }
  }
  $("#files").value = "";
}

function stageTracker() {
  const b = addMessage("bot", `<p><strong>On the case!</strong></p>
    <ul class="stages">${STAGES.map(([k, icon, name]) =>
      `<li data-stage="${k}"><span class="dot">${icon}</span>${name}</li>`).join("")}</ul>
    <div class="detail"></div>`);
  return {
    set(stage, text) {
      let reached = false;
      for (const li of b.querySelectorAll("li")) {
        const isNow = li.dataset.stage === stage;
        if (isNow) reached = true;
        li.classList.toggle("now", isNow);
        li.classList.toggle("done", !reached);
      }
      b.querySelector(".detail").textContent = text || "";
    },
    finish() { b.querySelectorAll("li").forEach((li) => { li.classList.remove("now"); li.classList.add("done"); }); },
  };
}

async function send(text) {
  if (busy) return;
  busy = true;
  $("#send").disabled = true;
  addMessage("user", esc(text));
  let tracker = null;
  try {
    const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session: sessionId, message: text, llm: $("#use-llm").checked, remember: $("#remember").checked }) });
    if (!res.ok) throw new Error(`Request failed (${res.status})`);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let cut;
      while ((cut = buffer.indexOf("\n\n")) >= 0) {
        const block = buffer.slice(0, cut);
        buffer = buffer.slice(cut + 2);
        const event = (block.match(/^event: (.*)$/m) || [])[1];
        const data = JSON.parse((block.match(/^data: (.*)$/m) || [null, "{}"])[1]);
        if (event === "stage") {
          if (!tracker && data.stage === "collect") tracker = stageTracker();
          tracker?.set(data.stage, data.text);
          roam(data.stage, data.text);
        } else if (event === "report") {
          tracker?.finish();
          showReport(data);
        } else if (event === "style") {
          currentStyle = data.style;
        } else if (event === "say") {
          const el = addMessage("bot", richText(data.text));
          if (data.summary) { lastSummary = el; el.classList.add("summary"); }
        } else if (event === "error") {
          addMessage("bot", `<p class="error-text">${esc(data.message)}</p>`);
        }
      }
    }
    home(tracker ? "Here you go! 🎁" : "", Boolean(tracker));
  } catch (err) {
    addMessage("bot", `<p class="error-text">${esc(err.message)}</p>`);
    home("Oh no, something went wrong.");
  } finally {
    busy = false;
    $("#send").disabled = false;
  }
}

/* ---------- report cards ---------- */
function chips(ids, byId) {
  return ids.map((id) => `<span class="chip" title="${esc(byId[id]?.summary)}">${esc(id)}</span>`).join("");
}
let currentStyle = "simple";
let lastReport = null;
let lastSummary = null;
const STYLE_NAMES = { nerd: "🤓 Data nerd", simple: "🙂 Straight answer", kid: "🧸 Like I'm 5" };

function showReport(data) {
  const bubble = addMessage("bot", "");
  bubble.classList.add("report");
  lastReport = { ...data, el: bubble };
  currentStyle = data.style || currentStyle;
  renderReport();
}
function renderReport() {
  const { report, chart, el } = lastReport;
  el.innerHTML = `<div class="style-row" role="group" aria-label="How should I explain it?">
      <span class="meta">Explain it as:</span>${Object.entries(STYLE_NAMES).map(([k, n]) =>
        `<button type="button" class="style-btn${k === currentStyle ? " on" : ""}" data-style="${k}">${n}</button>`).join("")}</div>
    ${chart ? chartSvg(chart) : ""}
    ${reportHtml(report, currentStyle)}
    <div class="actions-row">
      <a href="/api/report/${sessionId}.md" download>⬇️ Download report</a>
      <button type="button" data-act="print">🖨️ Print or save as PDF</button></div>`;
  el.querySelectorAll(".style-btn").forEach((b) => b.addEventListener("click", () => chooseStyle(b.dataset.style)));
  el.querySelector('[data-act="print"]').addEventListener("click", () => printReport(el));
}
async function chooseStyle(style) {
  if (busy || style === currentStyle) return;
  currentStyle = style;
  renderReport();
  try {
    const r = await post("/api/style", { session: sessionId, style });
    if (r.summary && lastSummary) lastSummary.innerHTML = richText(r.summary);
  } catch (err) { /* the cards are already updated */ }
  hop({ nerd: "Nerd mode on! 🤓", simple: "Keeping it simple 🙂", kid: "Story time! 🧸" }[style]);
}
function printReport(el) {
  el.querySelectorAll("details").forEach((d) => { d.open = true; });
  if (lastSummary) lastSummary.classList.add("print-me");
  el.classList.add("print-me");
  window.print();
  document.querySelectorAll(".print-me").forEach((x) => x.classList.remove("print-me"));
}

function chartSvg(c) {
  const W = 640, H = 190, L = 44, R = 10, T = 14, B = 30;
  const t = c.times.map((x) => Date.parse(x));
  const t0 = Math.min(...t), t1 = Math.max(...t);
  const vmax = Math.max(...c.values) * 1.08 || 1, vmin = Math.min(0, Math.min(...c.values));
  const x = (ms) => L + (W - L - R) * (ms - t0) / Math.max(1, t1 - t0);
  const y = (v) => T + (H - T - B) * (1 - (v - vmin) / (vmax - vmin));
  const pts = c.values.map((v, i) => `${x(t[i]).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const cx = x(Date.parse(c.change));
  const fmt = (v) => Math.abs(v) >= 100 ? v.toFixed(0) : Math.abs(v) >= 1 ? v.toFixed(1) : v.toPrecision(2);
  const colour = { deploys: "var(--bot-red)", config_changes: "#e8a33d", alerts: "#9b6dd6", tickets: "#3aa57a", logs: "var(--muted)" };
  const markers = c.markers.filter((m) => { const ms = Date.parse(m.time); return ms >= t0 && ms <= t1; })
    .map((m) => { const mx = x(Date.parse(m.time)).toFixed(1);
      return `<g class="marker"><title>${esc(m.id)} · ${esc(m.source.replace("_", " "))}: ${esc(m.text)}</title>
        <line x1="${mx}" x2="${mx}" y1="${H - B}" y2="${H - B + 7}" stroke="${colour[m.source] || "var(--muted)"}" stroke-width="2"/>
        <circle cx="${mx}" cy="${H - B + 11}" r="4.5" fill="${colour[m.source] || "var(--muted)"}"/></g>`; }).join("");
  const day = (ms) => new Date(ms).toISOString().slice(5, 16).replace("T", " ");
  return `<figure class="chart"><figcaption><strong>${esc(c.metric)}</strong> in ${esc(c.where)}
      <span class="meta">· dashed line = when it changed · dots = clues (hover to read)</span></figcaption>
    <svg viewBox="0 0 ${W} ${H + 8}" role="img" aria-label="${esc(c.metric)} over time, jumping from ${fmt(c.before)} to ${fmt(c.after)}">
      <line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="var(--line)"/>
      <text x="${L - 6}" y="${y(vmax / 1.08) + 4}" text-anchor="end" class="axis">${fmt(vmax / 1.08)}</text>
      <text x="${L - 6}" y="${H - B + 4}" text-anchor="end" class="axis">${fmt(vmin)}</text>
      <text x="${L}" y="${H + 6}" class="axis">${day(t0)}</text>
      <text x="${W - R}" y="${H + 6}" text-anchor="end" class="axis">${day(t1)}</text>
      <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round"/>
      <line x1="${cx}" x2="${cx}" y1="${T}" y2="${H - B}" stroke="var(--bot-red)" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="${cx + 4}" y="${T + 10}" class="axis" fill="var(--bot-red)">changed ${day(Date.parse(c.change)).slice(6)}</text>
      ${markers}</svg></figure>`;
}

function reportHtml(r, style = "simple") {
  const byId = Object.fromEntries(r.evidence.map((e) => [e.id, e]));
  const v = r.sufficiency.verdict;
  const sure = { sufficient: "I'm sure.", partial: "I'm partly sure.", insufficient: "Not enough clues yet." }[v];
  const out = [];
  let delay = 0;
  const card = (html, cls = "") => out.push(`<section class="card ${cls}" style="animation-delay:${(delay += .12).toFixed(2)}s">${html}</section>`);
  const nice = (s) => s.replace(/_/g, " ");

  card(`<h3>Verdict</h3><div class="verdict">${esc(v)}</div><p class="meta">${sure} Score ${r.sufficiency.score.toFixed(2)}</p>
    <ul class="reasons">${r.sufficiency.reasons.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
    ${r.sufficiency.missing_data.length ? `<p class="meta">Data that would help: ${esc(r.sufficiency.missing_data.join("; "))}</p>` : ""}`, `v-${v}`);
  const wc = r.what_changed;
  if (!wc && r.summary) card(`<h3>What happened</h3><p>${esc(r.summary)}</p>`);
  else card(`<h3>What changed</h3>${wc ? `<p>${esc(nice(wc.metric))} in <strong>${esc(Object.values(wc.segment).filter((x) => x !== "all").join(", ") || "everything")}</strong>
    went from ${+wc.baseline_value.toPrecision(3)} to ${+wc.current_value.toPrecision(3)}
    (<strong>${wc.relative_change >= 0 ? "+" : ""}${Math.round(wc.relative_change * 100)}%</strong>)
    at ${esc(wc.change_start.slice(11, 16))} on ${esc(wc.change_start.slice(0, 10))}.</p><p>${chips(wc.evidence_ids, byId)}</p>`
    : "<p>No clear change was found in the numbers.</p>"}`);
  card(`<h3>${v === "insufficient" ? "Possible leads (not confirmed)" : "Why it happened"}</h3>${r.contributing_factors.length
    ? r.contributing_factors.map((f) => `<div class="factor"><strong>${f.rank}. ${esc(f.description)}</strong>
      <div class="meta">${esc(nice(f.category))} · confidence ${Math.round(f.confidence * 100)}%</div>
      <div class="bar"><span style="width:${Math.round(f.confidence * 100)}%"></span></div>
      ${f.why_chain.length ? `<ul>${f.why_chain.map((w) => `<li>${esc(w)}</li>`).join("")}</ul>` : ""}
      <div>${chips(f.evidence_ids, byId)}</div></div>`).join("") : "<p>No cause is supported by the evidence.</p>"}`, "wide");
  if (r.ruled_out.length) card(`<h3>Ruled out</h3><ul>${r.ruled_out.map((x) =>
    `<li><strong>${esc(x.hypothesis)}</strong>: ${esc(x.reason)} ${chips(x.evidence_ids, byId)}</li>`).join("")}</ul>`);
  if (r.actions.length) card(`<h3>What to do</h3><ul>${r.actions.map((a) =>
    `<li><span class="meta">${esc(a.type)} · ${esc(a.priority)}</span><br>${esc(a.action)}</li>`).join("")}</ul>`);
  const g = r.guardrails;
  if (g && g.model_used) card(`<h3>Fact-check</h3><ul>
    ${g.quotes_checked ? `<li>Quotes checked against the document: ${g.quotes_checked}; not found and removed: ${g.quotes_rejected}</li>` : ""}
    <li>Clue numbers cited: ${g.ids_cited}; invented and removed: ${g.ids_invented}</li>
    <li>Unsupported causes dropped: ${g.factors_dropped}</li>
    ${g.engine_override ? "<li>The maths helpers overruled a cause that didn't fit.</li>" : ""}
    ${g.rivals_added ? `<li>Competing changes named: ${g.rivals_added}</li>` : ""}</ul>`);
  card(`<details><summary>All ${r.evidence.length} clues</summary><ul>${r.evidence.map((e) =>
    `<li><span class="chip">${esc(e.id)}</span>${esc(e.summary)}</li>`).join("")}</ul></details>`, "wide");
  if (style === "nerd") return `<div class="cards">${out.join("")}</div>`;
  if (style === "kid") return `<details class="more"><summary>Show the grown-up details</summary><div class="cards">${out.join("")}</div></details>`;
  const keep = out.filter((c) => /<h3>(Verdict|What changed|What happened|Why it happened|Possible leads|What to do)/.test(c));
  const rest = out.filter((c) => !keep.includes(c));
  return `<div class="cards">${keep.join("")}</div>` +
    (rest.length ? `<details class="more"><summary>More details</summary><div class="cards">${rest.join("")}</div></details>` : "");
}

/* ---------- CuteBot ---------- */
const bot = $("#cutebot");
const input = $("#input");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let pos = { x: 0, y: 0 };
let wander = null;
let sayTimer = null;

function homeSpot() {
  const c = $(".composer").getBoundingClientRect();
  const x = c.left - bot.offsetWidth - 6;
  return x >= 4 ? { x, y: c.top - bot.offsetHeight + 34 }
               : { x: c.left + 8, y: c.top - bot.offsetHeight - 4 };
}
function placeAt(p) {
  pos = p;
  alignSay();
  bot.style.transform = `translate(${Math.round(p.x)}px, ${Math.round(p.y)}px)`;
}
function randomSpot() {
  const w = bot.offsetWidth, h = bot.offsetHeight;
  const maxY = $(".composer").getBoundingClientRect().top - h - 10;
  const minY = $("header").offsetHeight + 60;
  return { x: 10 + Math.random() * Math.max(10, innerWidth - w - 20), y: minY + Math.random() * Math.max(20, maxY - minY) };
}
function alignSay() {
  // keep the speech bubble on screen when CuteBot is near an edge
  const el = $("#say"), w = bot.offsetWidth, half = 120;
  const centre = pos.x + w / 2;
  const shift = Math.max(half + 6 - centre, Math.min(0, innerWidth - 6 - half - centre));
  el.style.transform = `translateX(calc(-50% + ${Math.round(shift)}px))`;
  el.style.setProperty("--tail", `calc(50% - ${Math.round(shift)}px)`);
}
function say(text, ms = 0) {
  const el = $("#say");
  alignSay();
  el.textContent = text;
  el.classList.toggle("show", Boolean(text));
  clearTimeout(sayTimer);
  if (ms) sayTimer = setTimeout(() => el.classList.remove("show"), ms);
}
function sparkle() {
  const s = document.createElement("span");
  s.className = "sparkle";
  s.textContent = ["✨", "⭐", "💫"][Math.floor(Math.random() * 3)];
  s.style.left = `${pos.x + bot.offsetWidth / 2}px`;
  s.style.top = `${pos.y + bot.offsetHeight - 10}px`;
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 1200);
}
function roam(stage, text) {
  const found = STAGES.find(([k]) => k === stage);
  $("#prop").textContent = found ? found[1] : "🔍";
  if (stage === "back") return;
  say(found ? `${found[2]}...` : text);
  if (reduceMotion) return;
  bot.className = "busy";
  placeAt(randomSpot());
  sparkle();
  clearInterval(wander);
  wander = setInterval(() => {
    placeAt(randomSpot());
    sparkle();
    if (Math.random() < .35) say(IDLE_LINES[Math.floor(Math.random() * IDLE_LINES.length)]);
  }, 2300);
}
function home(text, happy = false) {
  clearInterval(wander);
  $("#prop").textContent = happy ? "🎁" : "";
  bot.className = "";
  placeAt(homeSpot());
  say(text, 3500);
  if (happy && !reduceMotion) setTimeout(() => { bot.className = "happy"; }, 1100);
  setTimeout(() => { if (!busy) $("#prop").textContent = ""; }, 4000);
}
function hop(text) {
  say(text, 2500);
  if (reduceMotion) return;
  bot.className = "happy";
  setTimeout(() => { bot.className = ""; }, 1600);
}

bot.addEventListener("click", () => {
  if (busy) return;
  bot.className = "wave";
  say(TAP_LINES[Math.floor(Math.random() * TAP_LINES.length)], 2200);
  setTimeout(() => { bot.className = ""; }, 1300);
});
addEventListener("resize", () => { if (!busy) placeAt(homeSpot()); });

/* ---------- composer ---------- */
function autosize() { input.style.height = "auto"; input.style.height = `${Math.min(input.scrollHeight, 180)}px`; }
input.addEventListener("input", autosize);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#composer").requestSubmit(); }
});
$("#composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = "";
  autosize();
  send(text);
});
$("#plus").addEventListener("click", () => $("#files").click());
$("#files").addEventListener("change", (e) => uploadFiles(e.target.files));
const composer = $("#composer");
["dragenter", "dragover"].forEach((t) => document.addEventListener(t, (e) => { e.preventDefault(); composer.classList.add("drag"); }));
["dragleave", "drop"].forEach((t) => document.addEventListener(t, (e) => { e.preventDefault(); composer.classList.remove("drag"); }));
document.addEventListener("drop", (e) => { if (e.dataTransfer?.files.length) uploadFiles(e.dataTransfer.files); });
/* ---------- memory (consent) ---------- */
const rememberBox = $("#remember");
try { rememberBox.checked = localStorage.getItem("cutebot-remember") === "1"; } catch (e) { /* private mode */ }
$("#forget").hidden = !rememberBox.checked;
rememberBox.addEventListener("change", async () => {
  try { localStorage.setItem("cutebot-remember", rememberBox.checked ? "1" : "0"); } catch (e) { /* ignore */ }
  $("#forget").hidden = !rememberBox.checked;
  if (rememberBox.checked) {
    const info = await fetch("/api/memory").then((r) => r.json()).catch(() => ({ available: false }));
    addMessage("bot", richText(info.available
      ? `🧠 **Memory on.** After each investigation I'll keep a tiny case note on this computer (in ${info.folder}), so I can spot similar problems and learn from your corrections. Nothing leaves this computer, and you can delete everything with **Forget**. I have ${info.cases} note(s) so far.`
      : "Memory isn't available on this server (it was started with --no-memory)."));
    hop("I'll remember! 🧠");
  } else {
    addMessage("bot", richText("🧠 **Memory off.** I won't keep notes from now on. Existing notes stay until you press Forget."));
  }
});
$("#forget").addEventListener("click", async () => {
  if (!confirm("Delete all of CuteBot's case notes on this computer? This can't be undone.")) return;
  const r = await fetch("/api/memory", { method: "DELETE" }).then((x) => x.json()).catch(() => ({ forgotten: 0 }));
  addMessage("bot", richText(`Done! I forgot ${r.forgotten} case note(s). 🧹`));
});

$("#new-chat").addEventListener("click", async () => {
  if (busy) return;
  await post("/api/reset", { session: sessionId }).catch(() => {});
  sessionId = newSessionId();
  $("#messages").innerHTML = "";
  welcome();
  hop("Fresh start! ✨");
});

fetch("/api/info").then((r) => r.json()).then((info) => { connected = info.connected; })
  .catch(() => {}).finally(() => welcome());
requestAnimationFrame(() => { placeAt(homeSpot()); say("Hi, I'm CuteBot! 👋", 3500); });
</script>
</body>
</html>
