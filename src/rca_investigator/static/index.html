<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCA Investigator</title>
<style>
:root {
  --bg: #f6f7fb; --panel: #ffffff; --ink: #1f2430; --muted: #5d6475; --line: #e2e5ee;
  --accent: #4f6bed; --accent-soft: #e8ecfd; --bot: #7c8cf8; --bot-dark: #4f5fd6;
  --ok: #1f8a5b; --ok-soft: #e3f5ec; --warn: #a76a00; --warn-soft: #fff3da;
  --bad: #b3383d; --bad-soft: #fbe6e7; --shadow: 0 2px 10px rgba(30, 40, 80, .08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161d; --panel: #1d2029; --ink: #e8eaf1; --muted: #a2a8b8; --line: #2e3240;
    --accent: #8ea0ff; --accent-soft: #262c48; --bot: #8ea0ff; --bot-dark: #5d6ee0;
    --ok: #5fd39c; --ok-soft: #1b3329; --warn: #f0b955; --warn-soft: #3a2f17;
    --bad: #f08a8e; --bad-soft: #3d1f22; --shadow: 0 2px 10px rgba(0, 0, 0, .35);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
main { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
header h1 { margin: 0; font-size: 1.6rem; }
header p { margin: 4px 0 0; color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 20px 0;
  background: var(--panel); padding: 14px; border-radius: 12px; box-shadow: var(--shadow); }
select, button { font: inherit; border-radius: 8px; border: 1px solid var(--line);
  padding: 8px 12px; background: var(--panel); color: var(--ink); }
select { flex: 1 1 320px; min-width: 0; }
button { background: var(--accent); color: #fff; border: none; cursor: pointer; font-weight: 600; }
button:disabled { opacity: .5; cursor: default; }
label.toggle { display: flex; gap: 6px; align-items: center; color: var(--muted); }

/* The case room where CuteBot runs between stations */
.room { position: relative; height: 360px; background: var(--panel); border-radius: 16px;
  box-shadow: var(--shadow); }
.station { position: absolute; width: 96px; text-align: center; font-size: .8rem;
  color: var(--muted); transform: translate(-50%, -50%); transition: color .3s; }
.station .icon { font-size: 1.8rem; display: block; width: 56px; height: 56px; line-height: 56px;
  margin: 0 auto 4px; border-radius: 50%; background: var(--accent-soft); transition: transform .3s; }
.station.active { color: var(--ink); font-weight: 600; }
.station.active .icon { transform: scale(1.15); box-shadow: 0 0 0 3px var(--accent); }
.station.done .icon::after { content: "✓"; position: absolute; margin: -8px 0 0 -6px;
  font-size: .9rem; color: var(--ok); }
#bot { position: absolute; width: 84px; transform: translate(-50%, -50%);
  transition: left .9s cubic-bezier(.5, 0, .3, 1.3), top .9s cubic-bezier(.5, 0, .3, 1.3); z-index: 2; }
#bot svg { width: 84px; height: 96px; display: block; animation: bob 1.4s ease-in-out infinite; }
#bot.running svg { animation: run .35s ease-in-out infinite; }
#bot.happy svg { animation: hop .6s ease-in-out 3; }
@keyframes bob { 50% { transform: translateY(-4px); } }
@keyframes run { 0%, 100% { transform: rotate(-6deg) translateY(0); } 50% { transform: rotate(6deg) translateY(-6px); } }
@keyframes hop { 50% { transform: translateY(-18px); } }
.eye { animation: blink 4s infinite; transform-origin: center; transform-box: fill-box; }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
.bubble { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%);
  width: max-content; max-width: 240px; background: var(--ink); color: var(--panel);
  font-size: .78rem; line-height: 1.35; padding: 6px 10px; border-radius: 10px; margin-bottom: 4px;
  opacity: 0; transition: opacity .25s; pointer-events: none; }
.bubble.show { opacity: 1; }
.bubble::after { content: ""; position: absolute; top: 100%; left: 50%; margin-left: -6px;
  border: 6px solid transparent; border-top-color: var(--ink); }

.log { list-style: none; padding: 0; margin: 16px 0 0; font-size: .9rem; color: var(--muted); }
.log li { padding: 4px 0 4px 22px; position: relative; animation: fade .3s; }
.log li::before { content: "•"; position: absolute; left: 6px; color: var(--accent); }

/* Report cards */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-top: 20px; }
.card { background: var(--panel); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow);
  opacity: 0; transform: translateY(12px); animation: rise .5s forwards; }
.card.wide { grid-column: 1 / -1; }
.card h2 { font-size: 1rem; margin: 0 0 8px; }
.card p, .card ul { margin: 6px 0; }
.card ul { padding-left: 18px; }
@keyframes rise { to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } }
.verdict { font-size: 1.3rem; font-weight: 700; text-transform: capitalize; }
.v-sufficient { background: var(--ok-soft); } .v-sufficient .verdict { color: var(--ok); }
.v-partial { background: var(--warn-soft); } .v-partial .verdict { color: var(--warn); }
.v-insufficient { background: var(--bad-soft); } .v-insufficient .verdict { color: var(--bad); }
.reasons { list-style: none; padding: 0 !important; font-size: .9rem; }
.factor { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
.factor:first-of-type { border-top: none; margin-top: 0; padding-top: 0; }
.meta { font-size: .8rem; color: var(--muted); }
.bar { height: 6px; background: var(--line); border-radius: 3px; margin: 4px 0 6px; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.chip { display: inline-block; font-size: .75rem; font-weight: 600; padding: 1px 7px; margin: 0 3px 3px 0;
  border-radius: 999px; background: var(--accent-soft); color: var(--accent); cursor: help; }
.evidence li { font-size: .85rem; margin-bottom: 4px; }
.error { color: var(--bad); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .card { opacity: 1; transform: none; }
}
@media (max-width: 560px) {
  .room { height: 320px; }
  .station { width: 64px; font-size: .7rem; }
  .station .icon { width: 44px; height: 44px; line-height: 44px; font-size: 1.4rem; }
  #bot, #bot svg { width: 64px; } #bot svg { height: 74px; }
  .bubble { max-width: 200px; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>RCA Investigator</h1>
    <p>Pick an incident and watch <strong class="bot-name">CuteBot</strong> find out what changed, why, and whether the evidence is enough.</p>
  </header>

  <div class="controls">
    <select id="incident" aria-label="Incident"></select>
    <label class="toggle"><input type="checkbox" id="use-llm" checked> use the language model</label>
    <button id="go">Investigate</button>
  </div>

  <div class="room" id="room" aria-live="polite">
    <div class="station" data-station="numbers" style="left:14%;top:45%"><span class="icon">📈</span>Graphs</div>
    <div class="station" data-station="records" style="left:38%;top:42%"><span class="icon">📄</span>Records</div>
    <div class="station" data-station="model" style="left:62%;top:45%"><span class="icon">🧠</span>Model</div>
    <div class="station" data-station="fact_check" style="left:86%;top:42%"><span class="icon">🔍</span>Fact-check</div>
    <div class="station" data-station="judge" style="left:74%;top:85%"><span class="icon">⚖️</span>Judge</div>
    <div class="station" data-station="home" style="left:26%;top:85%"><span class="icon">🏠</span>Report</div>
    <div id="bot" style="left:26%;top:calc(85% - 60px)">
      <div class="bubble" id="bubble"></div>
      <svg viewBox="0 0 84 96" aria-hidden="true">
        <line x1="42" y1="14" x2="42" y2="4" stroke="var(--bot-dark)" stroke-width="3" stroke-linecap="round"/>
        <circle cx="42" cy="4" r="4" fill="#ffb347"/>
        <rect x="12" y="14" width="60" height="46" rx="20" fill="var(--bot)"/>
        <rect x="20" y="22" width="44" height="28" rx="13" fill="#fff"/>
        <ellipse class="eye" cx="33" cy="36" rx="5" ry="6" fill="#1f2430"/>
        <ellipse class="eye" cx="51" cy="36" rx="5" ry="6" fill="#1f2430"/>
        <circle cx="35" cy="34" r="1.6" fill="#fff"/><circle cx="53" cy="34" r="1.6" fill="#fff"/>
        <ellipse cx="25" cy="45" rx="3.5" ry="2" fill="#ff9aa8" opacity=".8"/>
        <ellipse cx="59" cy="45" rx="3.5" ry="2" fill="#ff9aa8" opacity=".8"/>
        <path d="M37 45 q5 4 10 0" stroke="#1f2430" stroke-width="2" fill="none" stroke-linecap="round"/>
        <rect x="24" y="60" width="36" height="22" rx="10" fill="var(--bot-dark)"/>
        <circle cx="42" cy="71" r="4" fill="#ffd36e"/>
        <rect x="28" y="82" width="9" height="10" rx="4" fill="var(--bot-dark)"/>
        <rect x="47" y="82" width="9" height="10" rx="4" fill="var(--bot-dark)"/>
        <rect x="64" y="60" width="6" height="14" rx="3" fill="var(--bot-dark)" transform="rotate(-30 67 67)"/>
        <circle cx="74" cy="56" r="7" fill="none" stroke="#8a6d3b" stroke-width="3"/>
        <circle cx="74" cy="56" r="5" fill="#cfe8ff" opacity=".7"/>
        <rect x="14" y="62" width="6" height="14" rx="3" fill="var(--bot-dark)" transform="rotate(20 17 69)"/>
      </svg>
    </div>
  </div>

  <ul class="log" id="log"></ul>
  <section class="cards" id="cards"></section>
</main>

<script>
const $ = (sel) => document.querySelector(sel);
const STATION_OF = (step) => step.replace(/_done$/, "");
let botName = "CuteBot";
let source = null;

function esc(text) {
  const d = document.createElement("div");
  d.textContent = text ?? "";
  return d.innerHTML;
}

function moveBot(station, running = true) {
  const el = document.querySelector(`[data-station="${station}"]`);
  if (!el) return;
  document.querySelectorAll(".station").forEach((s) => s.classList.toggle("active", s === el));
  const bot = $("#bot");
  bot.style.left = el.style.left;
  bot.style.top = `calc(${el.style.top} - 60px)`;
  bot.className = running ? "running" : "";
  clearTimeout(moveBot.timer);
  moveBot.timer = setTimeout(() => { bot.className = ""; }, 900);
}

function say(text) {
  const b = $("#bubble");
  b.textContent = text;
  b.classList.add("show");
}

function log(text, cls = "") {
  const li = document.createElement("li");
  li.textContent = text;
  if (cls) li.className = cls;
  $("#log").appendChild(li);
}

function chips(ids, byId) {
  return ids.map((id) => `<span class="chip" title="${esc(byId[id]?.summary)}">${esc(id)}</span>`).join("");
}

function showReport(r) {
  const byId = Object.fromEntries(r.evidence.map((e) => [e.id, e]));
  const v = r.sufficiency.verdict;
  const sure = { sufficient: "I'm sure.", partial: "I'm partly sure.", insufficient: "I don't have enough clues yet." }[v];
  const cards = [];
  let delay = 0;
  const card = (html, cls = "") => cards.push(`<article class="card ${cls}" style="animation-delay:${(delay += 0.15).toFixed(2)}s">${html}</article>`);

  card(`<h2>Verdict</h2><div class="verdict">${esc(v)}</div>
    <p class="meta">${esc(sure)} Score ${r.sufficiency.score.toFixed(2)}</p>
    <ul class="reasons">${r.sufficiency.reasons.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
    ${r.sufficiency.missing_data.length ? `<p class="meta">Data that would help: ${esc(r.sufficiency.missing_data.join("; "))}</p>` : ""}`, `v-${v}`);

  const wc = r.what_changed;
  card(`<h2>What changed</h2>${wc ? `<p>${esc(wc.metric)} in <strong>${esc(Object.values(wc.segment).join(", ") || "all traffic")}</strong>
    went from ${+wc.baseline_value.toPrecision(3)} to ${+wc.current_value.toPrecision(3)}
    (<strong>${wc.relative_change >= 0 ? "+" : ""}${Math.round(wc.relative_change * 100)}%</strong>)
    at ${esc(wc.change_start.slice(11, 16))} on ${esc(wc.change_start.slice(0, 10))}.</p>
    <p>${chips(wc.evidence_ids, byId)}</p>` : "<p>No significant change was found.</p>"}`);

  const title = v === "insufficient" ? "Possible leads (not confirmed)" : "Why it happened";
  card(`<h2>${title}</h2>${r.contributing_factors.length ? r.contributing_factors.map((f) => `
    <div class="factor"><strong>${f.rank}. ${esc(f.description)}</strong>
      <div class="meta">${esc(f.category.replace("_", " "))} · confidence ${Math.round(f.confidence * 100)}%</div>
      <div class="bar"><span style="width:${Math.round(f.confidence * 100)}%"></span></div>
      ${f.why_chain.length ? `<ul>${f.why_chain.map((w) => `<li>${esc(w)}</li>`).join("")}</ul>` : ""}
      <div>${chips(f.evidence_ids, byId)}</div></div>`).join("") : "<p>No cause is supported by the evidence.</p>"}`, "wide");

  if (r.ruled_out.length) card(`<h2>Ruled out</h2><ul>${r.ruled_out.map((x) =>
    `<li><strong>${esc(x.hypothesis)}</strong>: ${esc(x.reason)} ${chips(x.evidence_ids, byId)}</li>`).join("")}</ul>`);
  if (r.actions.length) card(`<h2>What to do</h2><ul>${r.actions.map((a) =>
    `<li><span class="meta">${esc(a.type)} · ${esc(a.priority)}</span><br>${esc(a.action)}</li>`).join("")}</ul>`);

  const g = r.guardrails;
  if (g && g.model_used) card(`<h2>Fact-check</h2><ul>
    <li>Clue numbers the model cited: ${g.ids_cited}, invented and removed: ${g.ids_invented}</li>
    <li>Unsupported causes dropped: ${g.factors_dropped}</li>
    ${g.engine_override ? "<li>The engines overruled a cause that didn't fit.</li>" : ""}
    ${g.rivals_added ? `<li>Competing changes added: ${g.rivals_added}</li>` : ""}
    ${g.engine_fallback ? "<li>The main cause comes from the engines.</li>" : ""}</ul>`);

  card(`<h2>Evidence</h2><ul class="evidence">${r.evidence.map((e) =>
    `<li><span class="chip">${esc(e.id)}</span>${esc(e.summary)}</li>`).join("")}</ul>`, "wide");

  $("#cards").innerHTML = cards.join("");
}

function investigate() {
  const id = $("#incident").value;
  if (!id) return;
  if (source) source.close();
  $("#log").innerHTML = "";
  $("#cards").innerHTML = "";
  document.querySelectorAll(".station").forEach((s) => s.classList.remove("done", "active"));
  $("#go").disabled = true;
  say(`On it! Investigating ${id}...`);
  const llm = $("#use-llm").checked;
  source = new EventSource(`/api/investigate/${encodeURIComponent(id)}?llm=${llm}`);
  source.addEventListener("step", (ev) => {
    const { step, message } = JSON.parse(ev.data);
    const station = STATION_OF(step);
    if (step.endsWith("_done") || step === "fact_check") {
      document.querySelector(`[data-station="${station}"]`)?.classList.add("done");
    }
    moveBot(station);
    say(message);
    log(message);
  });
  source.addEventListener("report", (ev) => {
    const report = JSON.parse(ev.data);
    moveBot("home");
    setTimeout(() => {
      $("#bot").className = "happy";
      say(`Here's what I found! Verdict: ${report.sufficiency.verdict}.`);
      showReport(report);
    }, 900);
  });
  source.addEventListener("error", (ev) => {
    if (ev.data) {
      const { message } = JSON.parse(ev.data);
      say("Oh no, something went wrong.");
      log(message, "error");
    }
  });
  source.addEventListener("done", () => { source.close(); $("#go").disabled = false; });
  source.onerror = () => { if (source.readyState === EventSource.CLOSED) $("#go").disabled = false; };
}

async function init() {
  try {
    const info = await (await fetch("/api/info")).json();
    botName = info.bot_name;
    document.querySelectorAll(".bot-name").forEach((el) => { el.textContent = botName; });
  } catch (e) { /* keep the default name */ }
  const list = await (await fetch("/api/incidents")).json();
  $("#incident").innerHTML = list.map((i) => `<option value="${esc(i.id)}">${esc(i.id)}: ${esc(i.question)}</option>`).join("");
  say(list.length ? `Hi, I'm ${botName}! Pick an incident.` : "No incidents found. Run: rca simulate");
  $("#go").addEventListener("click", investigate);
}
init();
</script>
</body>
</html>
